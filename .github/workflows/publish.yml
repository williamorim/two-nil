# Renderiza o site (pt-BR + en) e publica no GitHub Pages.
# Os resultados do R ficam congelados em _freeze/ e en/_freeze/ (execute: freeze),
# então o CI não executa as análises: renderize localmente e faça commit do _freeze.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.7.33

      # R só é usado pelo code-link (links das funções para a documentação);
      # as análises em si vêm do _freeze.
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::downlit
            any::xml2

      - name: Render
        run: ./render.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
