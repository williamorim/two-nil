# English site. Separate Quarto project rendered into `../_site/en/`.
# Render the Portuguese (root) site first: `./render.sh` does both in order.
project:
  type: website
  output-dir: ../_site/en

lang: en

website:
  title: "2–0"
  description: "Football data analysis, mostly in R."
  site-url: https://twonil.wamorim.com/en/
  repo-url: https://github.com/williamorim/two-nil
  favicon: ../assets/favicon.svg
  open-graph: true
  navbar:
    title: false
    logo: ../assets/favicon.svg
    logo-alt: "2–0"
    left:
      - href: index.qmd
        text: Posts
      - href: about.qmd
        text: About
    right:
      - icon: translate
        text: "PT"
        href: index.qmd
        aria-label: "Ler em português"
      - icon: rss
        href: index.xml
        aria-label: RSS
      - icon: github
        href: https://github.com/williamorim/two-nil
        aria-label: GitHub
  page-footer:
    center: "2–0 · Football data analysis"

format:
  html:
    theme: [simplex, ../assets/styles.scss]
    toc: true
    code-copy: true
    code-link: true
    highlight-style: github
    include-after-body: ../assets/lang-switch.html

execute:
  freeze: auto
